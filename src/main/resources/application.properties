spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# -------------------------------------------------------------
# MySQL datasource (credentials from environment variables)
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning (HikariCP defaults are fine for dev)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# -------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=validate -> entities are checked against existing
# tables; the schema is owned by schema.sql, not Hibernate.
# -------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# -------------------------------------------------------------
# Flyway disabled: schema + seed were applied manually.
# Re-enable later if you adopt versioned migrations.
# -------------------------------------------------------------
spring.flyway.enabled=false

# -------------------------------------------------------------
# Server
# -------------------------------------------------------------
server.port=8080
